<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">Product Manager</a>
            <span class="admin-label">Administration</span>
        </div>
    </header>

    <main class="container">

        <section class="page-heading">
            <p class="breadcrumb">Administration / Produkter</p>
            <h1>Produktadministration</h1>
            <p>Lägg till, hantera och ta bort produkter.</p>
        </section>

        <section class="card">

            <h2>Ny produkt</h2>

            <form id="product-form">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="name">Produktnamn</label>
                        <input type="text" id="name" name="name" placeholder="T.ex. Svart T-shirt" required>
                    </div>

                    <div class="form-group">
                        <label for="price">Pris (SEK)</label>
                        <input type="number" id="price" name="price" placeholder="0.00" min="0.01" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="sku">SKU</label>
                        <input type="text" id="sku" name="sku" placeholder="T.ex. TSH-001" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Beskrivning</label>
                        <textarea id="description" name="description" rows="5" placeholder="Beskriv produkten..."
                            required></textarea>
                    </div>

                </div>

                <p id="error-message" role="alert" hidden></p>

                <div class="form-actions">
                    <button type="submit" class="primary-button">
                        + Lägg till produkt
                    </button>
                </div>

            </form>

        </section>

        <section class="card">

            <div class="table-heading">
                <h2>Produktlista</h2>
                <span id="product-count">0 produkter</span>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Produkt</th>
                            <th>SKU</th>
                            <th>Pris</th>
                            <th>Åtgärd</th>
                        </tr>
                    </thead>

                    <tbody id="product-list">
                    </tbody>

                </table>
            </div>

        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 Product Manager / Amel Huremovic</p>
    </footer>

</body>

</html>
